name: Feature request
description: Propose new functionality for HamBench or a related repo.
title: "[Feature]: "
labels: ["status: needs triage"]
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Use this for something HamBench does not do yet. To change an existing feature, use the Enhancement form.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Who needs this, and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you would like it to work, including the screen, radio, or API if that matters.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, including doing nothing. Write "None" if you did not consider any.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Closest part of the project, if you know it. This is written into the issue body and does not add an area label.
      options:
        - ui
        - driver
        - modules
        - cat
        - channel library
        - log
        - sniffer
        - api
        - registry
    validations:
      required: false
